# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Set ADMIN_PASSWORD when prompted.
# The `rootDir` assumes the portal lives in the admin-portal/ folder of your repository.
services:
  - type: web
    name: linguaops-admin-portal
    runtime: docker
    rootDir: admin-portal
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@yourcompany.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO
        value: "false"
    disk:
      name: portal-data
      mountPath: /data
      sizeGB: 5
